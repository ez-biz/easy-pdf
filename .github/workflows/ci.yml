name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, not the 20 in deploy.yml: pdfjs-dist calls
      # Promise.withResolvers, which only exists from Node 22, so the
      # convert.test.ts suite cannot run on 20. Node 20 is also EOL.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `next build` also runs ESLint, which is what caught the
      # react/no-unescaped-entities error that blocked a release.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      # A single 404 in the service worker's precache manifest fails the whole
      # SW install, which would leave users worse off than having no SW at all.
      - name: Verify service worker precache
        run: node scripts/verify-precache.mjs
